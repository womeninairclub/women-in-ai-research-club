<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Participants | AI Innovation Hackathon 2026</title>

  <link rel="stylesheet" href="css/participants.css">
</head>

<body>

  <main class="participants-page">

    <!-- PAGE HEADER -->
    <section class="participants-hero">
      <div class="hero-content">

        <span class="hero-label">
          AI INNOVATION HACKATHON 2026
        </span>

        <h1>
          Participants
        </h1>

        <p>
          Meet the participants and teams taking part in the
          AI Innovation Hackathon 2026.
        </p>

      </div>
    </section>


    <!-- STATS -->
    <section class="participants-stats">

      <div class="stat-card">
        <span class="stat-label">Confirmed Entries</span>
        <strong id="participantCount">—</strong>
      </div>

      <div class="stat-card">
        <span class="stat-label">Countries</span>
        <strong id="countryCount">—</strong>
      </div>

      <div class="stat-card">
        <span class="stat-label">Teams</span>
        <strong id="teamCount">—</strong>
      </div>

    </section>


    <!-- TABLE -->
    <section class="participants-section">

      <div class="participants-table-wrapper">

        <table class="participants-table">

          <thead>
            <tr>
              <th>#</th>
              <th>Participant / Team</th>
              <th>Country</th>
              <th>Type</th>
              <th>Details</th>
            </tr>
          </thead>

          <tbody id="participantsTableBody">

            <tr>
              <td colspan="5" class="loading-message">
                Loading participants...
              </td>
            </tr>

          </tbody>

        </table>

      </div>

      <div id="participantsError" class="participants-error" hidden>
        Unable to load participants at the moment.
      </div>

    </section>

  </main>


  <script>

    /*
     * CURRENT PARTICIPANT API
     */
    const PARTICIPANTS_API =
      "https://script.google.com/macros/s/AKfycbwMX24cUnelzb1NSO71_vgMaEuF-on2NXRYTqycq7WJ0YkF8thwjt5eA8msd1vjCGF5/exec";


    /*
     * HTML ESCAPE
     */
    function escapeParticipantHTML(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /*
     * NORMALIZE TEXT
     */
    function normalizeText(value) {

      return String(value ?? "")
        .trim()
        .replace(/\s+/g, " ")
        .toLowerCase();

    }


    /*
     * SPLIT TEAM MEMBERS
     */
    function splitTeamMembers(value) {

      if (!value) {
        return [];
      }

      return String(value)
        .split(/[,;\n]+/)
        .map(name => name.trim())
        .filter(Boolean);

    }


    /*
     * LOAD PARTICIPANTS
     */
    async function loadParticipants() {

      const tableBody =
        document.getElementById("participantsTableBody");

      const errorBox =
        document.getElementById("participantsError");

      try {

        const response = await fetch(PARTICIPANTS_API, {
          method: "GET",
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("Failed to load participants.");
        }

        const data = await response.json();

        /*
         * API may return either:
         * { participants: [...] }
         * OR directly [...]
         */
        const participants =
          Array.isArray(data)
            ? data
            : Array.isArray(data.participants)
              ? data.participants
              : [];


        /*
         * No participants
         */
        if (participants.length === 0) {

          tableBody.innerHTML = `
            <tr>
              <td colspan="5" class="empty-message">
                No confirmed participants yet.
              </td>
            </tr>
          `;

          updateStats([], []);

          return;
        }


        /*
         * -----------------------------------------
         * STEP 1
         * COLLECT ALL TEAM MEMBER NAMES
         * -----------------------------------------
         *
         * Anyone listed inside a team's
         * Team Members field will not later
         * appear as an individual.
         */

        const allListedTeamMembers = new Set();


        participants.forEach(participant => {

          const teamName =
            String(participant.teamName || "").trim();

          if (!teamName) {
            return;
          }

          const members =
            splitTeamMembers(participant.teamMembers);

          members.forEach(member => {

            const normalized =
              normalizeText(member);

            if (normalized) {
              allListedTeamMembers.add(normalized);
            }

          });

        });


        /*
         * -----------------------------------------
         * STEP 2
         * BUILD UNIQUE TEAMS
         * -----------------------------------------
         */

        const teams = new Map();

        participants.forEach(participant => {

          const teamName =
            String(participant.teamName || "").trim();

          /*
           * IMPORTANT:
           * Team Name is the source of truth.
           *
           * We do NOT use participationType
           * to decide whether something is a team.
           */

          if (!teamName) {
            return;
          }


          const teamKey =
            normalizeText(teamName);


          if (!teamKey) {
            return;
          }


          if (!teams.has(teamKey)) {

            teams.set(teamKey, {
              type: "TEAM",
              name: teamName,
              country:
                String(participant.country || "").trim(),
              members: [],
              memberKeys: new Set()
            });

          }


          const team =
            teams.get(teamKey);


          /*
           * Add Team Members
           */

          const members =
            splitTeamMembers(participant.teamMembers);


          members.forEach(member => {

            const cleanedName =
              String(member).trim();

            const memberKey =
              normalizeText(cleanedName);

            if (!memberKey) {
              return;
            }


            /*
             * Don't show the team name itself
             * as a member.
             */

            if (memberKey === teamKey) {
              return;
            }


            /*
             * Avoid duplicate names.
             */

            if (!team.memberKeys.has(memberKey)) {

              team.members.push(cleanedName);

              team.memberKeys.add(memberKey);

            }

          });

        });


        /*
         * -----------------------------------------
         * STEP 3
         * BUILD GENUINE INDIVIDUALS
         * -----------------------------------------
         */

        const individuals = [];

        const individualKeys = new Set();


        participants.forEach(participant => {

          const name =
            String(participant.name || "").trim();

          const teamName =
            String(participant.teamName || "").trim();


          /*
           * If this row belongs to a team,
           * don't show it as an individual.
           */

          if (teamName) {
            return;
          }


          if (!name) {
            return;
          }


          const nameKey =
            normalizeText(name);


          /*
           * If the person appears in ANY
           * team's Team Members field,
           * don't show them separately.
           */

          if (allListedTeamMembers.has(nameKey)) {
            return;
          }


          /*
           * Avoid duplicate individual rows.
           */

          if (individualKeys.has(nameKey)) {
            return;
          }


          individualKeys.add(nameKey);


          individuals.push({
            type: "INDIVIDUAL",
            name: name,
            country:
              String(participant.country || "").trim(),
            members: []
          });

        });


        /*
         * -----------------------------------------
         * STEP 4
         * FINAL DISPLAY LIST
         * -----------------------------------------
         */

        const entries = [

          ...Array.from(teams.values()),

          ...individuals

        ];


        /*
         * Sort alphabetically
         */

        entries.sort((a, b) => {

          return normalizeText(a.name)
            .localeCompare(normalizeText(b.name));

        });


        /*
         * -----------------------------------------
         * STEP 5
         * RENDER TABLE
         * -----------------------------------------
         */

        tableBody.innerHTML = "";


        entries.forEach((entry, index) => {

          const row =
            document.createElement("tr");


          /*
           * ================================
           * TEAM
           * ================================
           */

          if (entry.type === "TEAM") {

            let detailsHTML =
              '<span class="no-members">No members listed</span>';


            if (entry.members.length > 0) {

              detailsHTML = `
                <div class="team-members-box">

                  <div class="team-members-heading">
                    Team Members
                  </div>

                  <div class="team-members-list">

                    ${entry.members
                      .map(member => `
                        <div class="team-member-name">

                          <span class="member-dot"></span>

                          <span>
                            ${escapeParticipantHTML(member)}
                          </span>

                        </div>
                      `)
                      .join("")}

                  </div>

                </div>
              `;

            }


            row.innerHTML = `

              <td class="participant-number">
                ${String(index + 1).padStart(2, "0")}
              </td>

              <td class="participant-name">
                ${escapeParticipantHTML(entry.name)}
              </td>

              <td class="participant-country">
                ${escapeParticipantHTML(entry.country)}
              </td>

              <td>
                <span class="participant-type team-type">
                  TEAM
                </span>
              </td>

              <td class="participant-details">
                ${detailsHTML}
              </td>

            `;

          }


          /*
           * ================================
           * INDIVIDUAL
           * ================================
           */

          else {

            row.innerHTML = `

              <td class="participant-number">
                ${String(index + 1).padStart(2, "0")}
              </td>

              <td class="participant-name">
                ${escapeParticipantHTML(entry.name)}
              </td>

              <td class="participant-country">
                ${escapeParticipantHTML(entry.country)}
              </td>

              <td>
                <span class="participant-type individual-type">
                  INDIVIDUAL
                </span>
              </td>

              <td class="participant-details participant-individual-details">
                <span class="no-members">
                  —
                </span>
              </td>

            `;

          }


          tableBody.appendChild(row);

        });


        /*
         * UPDATE STATISTICS
         */

        updateStats(entries, participants);


      }

      catch (error) {

        console.error(
          "Participants loading error:",
          error
        );


        tableBody.innerHTML = `

          <tr>
            <td colspan="5" class="error-message">
              Unable to load participants.
            </td>
          </tr>

        `;


        errorBox.hidden = false;

      }

    }


    /*
     * -----------------------------------------
     * UPDATE STATS
     * -----------------------------------------
     */

    function updateStats(entries, rawParticipants) {

      const participantCount =
        document.getElementById("participantCount");

      const countryCount =
        document.getElementById("countryCount");

      const teamCount =
        document.getElementById("teamCount");


      /*
       * Confirmed entries = visible rows
       */

      participantCount.textContent =
        entries.length;


      /*
       * Unique countries
       */

      const countries =
        new Set();


      entries.forEach(entry => {

        const country =
          String(entry.country || "").trim();

        if (country) {
          countries.add(
            normalizeText(country)
          );
        }

      });


      countryCount.textContent =
        countries.size;


      /*
       * Unique teams
       */

      const teams =
        entries.filter(
          entry => entry.type === "TEAM"
        );


      teamCount.textContent =
        teams.length;

    }


    /*
     * START
     */

    document.addEventListener(
      "DOMContentLoaded",
      loadParticipants
    );

  </script>

</body>
</html>
